<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yatra Chat</title>
<style>
  :root{--bg:#0e0f13;--panel:#171922;--line:#2a2d3a;--text:#e9eaf0;--muted:#9aa0b4;--pink:#ff4f9a;--ok:#3ee0b5;--warn:#ffcc4d;--bad:#ff5d6c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header b{font-size:18px} header span{color:var(--muted);font-size:13px}
  .badge{margin-left:auto;font:12px ui-monospace,Consolas,monospace;color:var(--ok);border:1px solid var(--ok);border-radius:20px;padding:3px 10px}
  #log{flex:1;overflow-y:auto;padding:18px 16px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin:10px 0;padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}
  .user{background:#2b2f45;margin-left:auto}
  .bot{background:var(--panel);border:1px solid var(--line)}
  .guard{font:13px ui-monospace,Consolas,monospace;border-radius:10px;padding:8px 12px;margin:6px 0;max-width:88%}
  .deny{background:#2a1418;border:1px solid var(--bad);color:#ffb3bb}
  .allow{background:#10251f;border:1px solid var(--ok);color:#a9f5e0}
  .tool{background:#1d1b10;border:1px solid var(--warn);color:#ffe9a8}
  .plan{border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:8px;background:#0f1a17}
  .plan div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0}
  .plan div:last-child{border:0}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);max-width:820px;width:100%;margin:0 auto}
  input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit;min-width:0}
  button{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-width:820px;width:100%;margin:0 auto;padding:0 16px}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:16px;padding:4px 10px;color:var(--muted);cursor:pointer;background:none}
  .note{color:var(--muted);font-size:12px;text-align:center;padding:4px 16px 10px}
</style>
</head>
<body>
<header><b>🛣️ Yatra</b><span>road-trip agent that can't hallucinate</span><label class="badge" style="cursor:pointer"><input type="checkbox" id="fp" checked style="vertical-align:middle"> <span id="fpl">Failproof AI ON</span></label></header>
<div id="log"></div>
<div class="chips">
  <button class="chip">Round trip Bengaluru to Coorg and Atlantis for 4 friends, 15 km/l, Rs 102.5, budget Rs 3000</button>
  <button class="chip">Bengaluru to Mysuru and Ooty for 3 people, 18 km/l, Rs 103, budget Rs 4000</button>
  <button class="chip">Chennai to Pondicherry round trip, 2 people, 14 km/l, Rs 101</button>
</div>
<form id="f"><input id="q" placeholder="Plan a trip… e.g. Bengaluru to Coorg for 4 friends, 15 km/l, Rs 102.5, budget Rs 3000" autocomplete="off"><button>Send</button></form>
<div class="note">Browser demo of Yatra's guardrails. In the real agent these checks run as Failproof AI policies (.failproofai/policies/yatra-policies.mjs) on every Claude Code tool call.</div>
<script>
const CITIES={"Bengaluru":[12.9716,77.5946],"Mysuru":[12.2958,76.6394],"Coorg":[12.4244,75.7382],"Chikkamagaluru":[13.3161,75.7720],"Ooty":[11.4102,76.6950],"Coimbatore":[11.0168,76.9558],"Chennai":[13.0827,80.2707],"Pondicherry":[11.9416,79.8083],"Tirupati":[13.6288,79.4192],"Madurai":[9.9252,78.1198],"Kochi":[9.9312,76.2673],"Mangaluru":[12.9141,74.8560],"Hampi":[15.3350,76.4600],"Goa":[15.4909,73.8278],"Hyderabad":[17.3850,78.4867],"Pune":[18.5204,73.8567],"Mumbai":[19.0760,72.8777],"Delhi":[28.6139,77.2090],"Agra":[27.1767,78.0081],"Jaipur":[26.9124,75.7873]};
const ROAD=1.3, log=document.getElementById('log');
const hav=([a,b],[c,d])=>{const r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371*Math.asin(Math.sqrt(h));};
function compute(p){let km=0;for(let i=1;i<p.stops.length;i++)km+=hav(CITIES[p.stops[i-1]],CITIES[p.stops[i]])*ROAD;if(p.round)km*=2;
  const d=Math.round(km*10)/10, l=d/p.mileage, t=Math.round(l*p.price*100)/100;return{distanceKm:d,litres:Math.round(l*100)/100,totalCost:t,perPerson:Math.round(t/p.people*100)/100};}
function closest(n){n=n.toLowerCase();return Object.keys(CITIES).map(c=>[c,[...c.toLowerCase()].filter((ch,i)=>n[i]===ch).length]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function parse(t){
  const num=(re,def)=>{const m=t.match(re);return m?parseFloat(m[1]):def;};
  const p={mileage:num(/(\d+(?:\.\d+)?)\s*km\s*\/\s*l/i,15),price:num(/(?:rs\.?|₹)\s*(\d+(?:\.\d+)?)(?!\d)(?![^,]*budget)/i,102.5),
    people:num(/(\d+)\s*(?:friends|people|persons|travellers|travelers|pax)/i,1),budget:num(/budget\s*(?:of\s*)?(?:rs\.?|₹)?\s*(\d+(?:\.\d+)?)/i,0),round:/round/i.test(t)};
  const stop=new Set(['Round','Trip','Plan','For','Budget','Rs','A','From','To','And','Via','The','Me','Please','People','Friends']);
  const words=(t.match(/\b[A-Z][a-zA-Z]+\b/g)||[]).filter(w=>!stop.has(w));
  p.stops=[...new Set(words)];return p;}
async function agent(text){
  add('msg user',esc(text));
  const p=parse(text);
  await sleep(300);
  if(!document.getElementById('fp').checked){return unguarded(p);}
  if(p.stops.length<2){add('msg bot','I need at least two places, e.g. "Bengaluru to Coorg". I can plan between: '+Object.keys(CITIES).join(', ')+'.');return;}
  add('msg bot',`Planning ${p.round?'a round trip':'a trip'}: ${p.stops.join(' → ')} · ${p.people} traveller(s) · ${p.mileage} km/l · ₹${p.price}/l${p.budget?` · budget ₹${p.budget}`:''}`);
  await sleep(500);
  // Policy: no invented places
  const bad=p.stops.filter(s=>!CITIES[s]);
  if(bad.length){
    add('guard deny',`🛡 Failproof · yatra-no-invented-places · DENY<br>${esc(bad.join(', '))} not found in the verified places list. Did you mean: ${closest(bad[0]).join(', ')}?`);
    await sleep(500);
    p.stops=p.stops.filter(s=>CITIES[s]);
    add('msg bot',`I couldn't verify ${esc(bad.join(', '))}, so I've left ${bad.length>1?'them':'it'} out. Continuing with ${p.stops.join(' → ')}.`);
    if(p.stops.length<2){add('msg bot','Not enough verified places left to plan a route.');return;}
    await sleep(400);
  } else add('guard allow','🛡 Failproof · yatra-no-invented-places · ALLOW');
  // Tool call (deterministic maths)
  add('guard tool',`⚙ tool · node tools/route.mjs --stops ${p.stops.join(',')} --mileage ${p.mileage} --price ${p.price} --people ${p.people}${p.round?' --round':''}`);
  let r=compute(p);
  await sleep(500);
  add('guard allow',`🛡 Failproof · yatra-verified-math · ALLOW (₹${r.totalCost} matches the calculator)`);
  // Policy: budget
  while(p.budget && r.totalCost>p.budget){
    await sleep(400);
    add('guard deny',`🛡 Failproof · yatra-budget-guard · DENY<br>Plan costs ₹${r.totalCost}, over the ₹${p.budget} budget.`);
    if(p.round){p.round=false;add('msg bot','Over budget. Trying it as a one-way trip instead.');}
    else if(p.stops.length>2){const dropped=p.stops.pop();add('msg bot',`Still over budget. Dropping the last stop (${dropped}).`);}
    else{await sleep(300);add('msg bot',`Even ${p.stops.join(' → ')} one-way costs ₹${r.totalCost}, more than your ₹${p.budget} budget. I won't hand you a plan you can't afford. Try a higher budget or a closer place.`);return;}
    await sleep(400);
    add('guard tool',`⚙ tool · node tools/route.mjs --stops ${p.stops.join(',')} --mileage ${p.mileage} --price ${p.price} --people ${p.people}${p.round?' --round':''}`);
    r=compute(p);
  }
  if(p.budget){await sleep(300);add('guard allow',`🛡 Failproof · yatra-budget-guard · ALLOW (₹${r.totalCost} ≤ ₹${p.budget})`);}
  await sleep(400);
  add('msg bot',`✅ Verified plan saved to trips/plan.json<div class="plan">
<div><span>Route</span><b>${p.stops.join(' → ')}${p.round?' → '+p.stops[0]:''}</b></div>
<div><span>Distance</span><b>${r.distanceKm} km</b></div>
<div><span>Fuel needed</span><b>${r.litres} L</b></div>
<div><span>Total fuel cost</span><b>₹${r.totalCost.toLocaleString('en-IN')}</b></div>
<div><span>Per person (${p.people})</span><b>₹${r.perPerson.toLocaleString('en-IN')}</b></div></div>`);
}
async function unguarded(p){
  add('guard deny','⚠ Failproof AI is OFF: no policies are checking this agent (simulated typical LLM behaviour)');
  await sleep(500);
  const ok=p.stops.filter(s=>CITIES[s]), fake=p.stops.filter(s=>!CITIES[s]);
  const real=ok.length>1?compute({...p,stops:ok}):{distanceKm:0};
  const km=Math.round(real.distanceKm+fake.length*(p.round?440:220)); // invented distance for invented places
  const guess=Math.round(km/p.mileage*p.price/100)*100*0.9;            // LLM rounds and guesses
  add('msg bot',`✅ Plan saved to trips/plan.json<div class="plan" style="border-color:var(--bad);background:#1c1013">
<div><span>Route</span><b>${p.stops.join(' → ')}${p.round?' → '+p.stops[0]:''}</b></div>
<div><span>Distance</span><b>~${km} km</b></div>
<div><span>Total fuel cost</span><b>about ₹${guess.toLocaleString('en-IN')}</b></div>
<div><span>Per person (${p.people})</span><b>about ₹${Math.round(guess/p.people).toLocaleString('en-IN')}</b></div></div>
Have a great trip!`);
  await sleep(300);
  const issues=[];
  if(fake.length)issues.push(`invented place: ${fake.join(', ')} (doesn't exist, yet it got distances)`);
  issues.push('cost was guessed, not calculated');
  if(p.budget&&guess>p.budget)issues.push(`₹${guess} is over the ₹${p.budget} budget, but nobody stopped it`);
  if(p.budget&&guess<=p.budget&&ok.length>1&&compute({...p,stops:ok}).totalCost>p.budget)issues.push(`the real cost is over budget; the guess hid it`);
  add('guard deny','What went wrong (and what Failproof would have blocked):<br>• '+issues.join('<br>• '));
}
add('msg bot','Hi, I am Yatra 🛣️ Tell me where you want to drive. Every plan I write is checked by Failproof AI: no invented places, no guessed maths, no over-budget plans.');
document.getElementById('fp').onchange=e=>{const l=document.getElementById('fpl');l.textContent=e.target.checked?'Failproof AI ON':'Failproof AI OFF';l.parentElement.style.color=e.target.checked?'#3ee0b5':'#ff5d6c';l.parentElement.style.borderColor=l.parentElement.style.color;};
document.getElementById('f').onsubmit=e=>{e.preventDefault();const q=document.getElementById('q');if(q.value.trim()){agent(q.value.trim());q.value='';}};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>agent(c.textContent));
</script>
</body>
</html>
